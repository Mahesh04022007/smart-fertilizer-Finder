{% extends "base.html" %}
{% block title %}Login | Smart Fertilizer Finder{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <h1 class="h3">Farmer login</h1>
    <p class="muted">Use the email and password from your registration.</p>
    <div class="demo-note mb-3">
      Demo farmer: <strong>farmer@example.com</strong><br>
      Password: <strong>Farmer@123</strong>
    </div>
    <form method="post" action="{{ url_for('login') }}" class="js-validate">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" required value="{{ form.get('email', '') }}" autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required minlength="6" autocomplete="current-password">
      </div>
      <button class="btn btn-success w-100" type="submit">Login</button>
    </form>
    <p class="mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create a farmer account</a></p>
  </div>
</section>
{% endblock %}
