<aside class="admin-side">
  <p class="admin-kicker">Administration</p>
  <a class="{% if request.endpoint == 'admin_dashboard' %}active{% endif %}" href="{{ url_for('admin_dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a>
  <a class="{% if request.endpoint in ['admin_products', 'admin_edit_product'] %}active{% endif %}" href="{{ url_for('admin_products') }}"><i class="bi bi-flower1"></i> Fertilizers</a>
  <a class="{% if request.endpoint in ['admin_shops', 'admin_edit_shop'] %}active{% endif %}" href="{{ url_for('admin_shops') }}"><i class="bi bi-shop"></i> Shops</a>
  <a class="{% if request.endpoint == 'admin_orders' %}active{% endif %}" href="{{ url_for('admin_orders') }}"><i class="bi bi-bag-check"></i> Orders</a>
  <a href="{{ url_for('home') }}"><i class="bi bi-house"></i> View website</a>
  <form method="post" action="{{ url_for('admin_logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="btn btn-gold btn-sm w-100 mt-2" type="submit">Logout</button>
  </form>
</aside>
